<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>دليلي ليبيا</title>
<!-- MapLibre bundled locally (4.7.1): the previous version loaded it
     from a remote CDN, so if that CDN was slow or unreachable on the
     user's network, the map never initialised at all and stayed white,
     even though routing (OSRM) still worked. Local files remove that
     single point of failure; only the tile styles still need internet. -->
<link href="maplibre-gl.css" rel="stylesheet" />
<script src="maplibre-gl.js"></script>
<style>
  html, body { margin: 0; height: 100%; }
  #map { width: 100%; height: 100%; background: #e8e8e8; }
  #note { position: absolute; top: 8px; right: 8px; background: rgba(255,255,255,0.9); padding: 6px 10px; font-family: sans-serif; font-size: 12px; z-index: 10; }
</style>
</head>
<body>
<div id="map"></div>
<div id="note">خريطة ليبيا — اسحب للتكبير والتدوير</div>
<script>
var styleUrls = [
  'https://tiles.openfreemap.org/styles/liberty',
  'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json'
];
var styleIndex = 0;
var map = new maplibregl.Map({
  container: 'map',
  style: styleUrls[0],
  center: [17.0, 27.0],
  zoom: 5.5,
  pitch: 0,
  maxZoom: 19
});
map.addControl(new maplibregl.NavigationControl(), 'top-left');
var routeCoords = [];
var currentGeometry = null;
var marker = null;
var reportMarkers = [];

function addBuildings() {
  try {
    // The Liberty style already has a built-in building-3d layer
    // (minzoom 14, filter !has hide_3d, height render_height).
    // Do not add a duplicate custom layer: it only causes z-fighting.
    // The old custom filter ['==','extrude','true'] matched almost no
    // OpenMapTiles buildings, which is why 3D looked flat even at zoom 16.
    if (map.getLayer('building-3d')) {
      // Built-in buildings are pale beige on a pale map, so darken them
      // for contrast instead of leaving the default washed-out colour.
      try {
        map.setPaintProperty('building-3d', 'fill-extrusion-color', '#94A89E');
        map.setPaintProperty('building-3d', 'fill-extrusion-opacity', 0.85);
      } catch (e2) {}
      return;
    }
    var layers = map.getStyle().layers;
    var labelLayer = null;
    for (var i = 0; i < layers.length; i++) {
      if (layers[i].type === 'symbol' && layers[i].layout && layers[i].layout['text-field']) { labelLayer = layers[i].id; break; }
    }
    if (!map.getSource('openmaptiles')) return;
    if (map.getLayer('3d-buildings')) return;
    map.addLayer({
      'id': '3d-buildings',
      'source': 'openmaptiles',
      'source-layer': 'building',
      'filter': ['!', ['has', 'hide_3d']],
      'type': 'fill-extrusion',
      'minzoom': 14,
      'paint': {
        'fill-extrusion-color': 'hsl(35,8%,85%)',
        'fill-extrusion-height': ['get', 'render_height'],
        'fill-extrusion-base': ['get', 'render_min_height'],
        'fill-extrusion-opacity': 0.8
      }
    }, labelLayer);
  } catch (e) { console.log('3d buildings: ' + e); }
}

function addRouteLayer() {
  if (!currentGeometry) return;
  // If the style is still loading (slow network, or the 6-second
  // fallback just switched styles), adding a source/layer throws and
  // — in the old setRoute — aborted everything after it, including
  // the camera move. Skip here; the style.load handler below re-adds
  // the layers as soon as the style is ready.
  if (!map.isStyleLoaded()) return;
  var geojson = { type: 'Feature', geometry: currentGeometry };
  if (map.getSource('route')) {
    map.getSource('route').setData(geojson);
    // A style change can leave the source without its layers; re-add
    // them instead of silently drawing no route at all.
    if (!map.getLayer('route-line')) {
      map.addLayer({ id: 'route-casing', type: 'line', source: 'route', paint: { 'line-color': '#FFFFFF', 'line-width': 11, 'line-opacity': 0.95 }, layout: { 'line-cap': 'round', 'line-join': 'round' } });
      map.addLayer({ id: 'route-line', type: 'line', source: 'route', paint: { 'line-color': '#0EA47A', 'line-width': 7 }, layout: { 'line-cap': 'round', 'line-join': 'round' } });
    }
  } else {
    map.addSource('route', { type: 'geojson', data: geojson });
    // White casing first, then a bright thick line: the route stays
    // readable on both the light vector map and satellite imagery.
    map.addLayer({ id: 'route-casing', type: 'line', source: 'route', paint: { 'line-color': '#FFFFFF', 'line-width': 11, 'line-opacity': 0.95 }, layout: { 'line-cap': 'round', 'line-join': 'round' } });
    map.addLayer({ id: 'route-line', type: 'line', source: 'route', paint: { 'line-color': '#0EA47A', 'line-width': 7 }, layout: { 'line-cap': 'round', 'line-join': 'round' } });
  }
}

// Map modes (mutually exclusive, managed by Kotlin): satellite photos,
// dark vector style, topographic raster, or the normal vector style.
// Only the normal style uses the tile-fallback timer below.
var satelliteOn = false;
var darkOn = false;
var topoOn = false;
function restoreVectorStyle() {
  satelliteOn = false; darkOn = false; topoOn = false;
  try { map.setMaxZoom(19); } catch (e) {}
  map.setStyle(styleUrls[styleIndex]);
}
window.setDark = function(on) {
  try {
    if (on) {
      darkOn = true; satelliteOn = false; topoOn = false;
      map.easeTo({ pitch: 0, duration: 300 });
      map.setStyle('https://tiles.openfreemap.org/styles/dark');
    } else { restoreVectorStyle(); }
  } catch (e) { console.log('dark: ' + e); }
};
window.setTopo = function(on) {
  try {
    if (on) {
      topoOn = true; satelliteOn = false; darkOn = false;
      if (map.getZoom() > 19) { map.setZoom(19); }
      map.easeTo({ pitch: 0, duration: 300 });
      map.setStyle({ version: 8, sources: { topo: { type: 'raster', tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}'], tileSize: 256, maxzoom: 19, attribution: '© Esri' } }, layers: [{ id: 'topo', type: 'raster', source: 'topo' }] });
    } else { restoreVectorStyle(); }
  } catch (e) { console.log('topo: ' + e); }
};

// Alternative routes, like Google Maps: every route is drawn, the
// selected one bright green on top, the others in a darker blue.
// Route time pills on the map (e.g. "39 د") at each route midpoint.
var routeLabelMarkers = [];
function clearRouteLabels() {
  for (var i = 0; i < routeLabelMarkers.length; i++) { routeLabelMarkers[i].remove(); }
  routeLabelMarkers = [];
}
var lastAltGeometries = null;
var lastAltSelected = 0;
window.setRoutes = function(geometries, selectedIndex) {
  lastAltGeometries = geometries; lastAltSelected = selectedIndex;
  // Same style-loading guard as addRouteLayer: without it, creating
  // the alternatives source throws while the style loads, and the
  // alternatives would be lost instead of deferred to style.load.
  if (!map.isStyleLoaded()) return;
  try {
    var feats = [];
    for (var i = 0; i < geometries.length; i++) {
      if (i === selectedIndex) continue;
      feats.push({ type: 'Feature', geometry: geometries[i] });
    }
    if (map.getSource('routeAlt')) {
      map.getSource('routeAlt').setData({ type: 'FeatureCollection', features: feats });
    } else if (feats.length > 0) {
      map.addSource('routeAlt', { type: 'geojson', data: { type: 'FeatureCollection', features: feats } });
      map.addLayer({ id: 'route-alt', type: 'line', source: 'routeAlt', paint: { 'line-color': '#4A7FB5', 'line-width': 5, 'line-opacity': 0.9 }, layout: { 'line-cap': 'round', 'line-join': 'round' } });
    }
    // Keep the selected route on top of the alternatives.
    try { if (map.getLayer('route-casing')) { map.moveLayer('route-casing'); } } catch (e2) {}
    try { if (map.getLayer('route-line')) { map.moveLayer('route-line'); } } catch (e2) {}
  } catch (e) { console.log('setRoutes: ' + e); }
};
window.setRouteLabels = function(labels) {
  try {
    clearRouteLabels();
    for (var i = 0; i < labels.length; i++) {
      var el = document.createElement('div');
      el.textContent = labels[i].text;
      el.style.cssText = 'background:#FFFFFF;border:2px solid #0B6B4F;color:#0B6B4F;font-family:sans-serif;font-size:13px;font-weight:bold;padding:3px 10px;border-radius:20px;white-space:nowrap;';
      var m = new maplibregl.Marker({ element: el }).setLngLat([labels[i].lon, labels[i].lat]).addTo(map);
      routeLabelMarkers.push(m);
    }
  } catch (e) { console.log('labels: ' + e); }
};

// Satellite (aerial-photo) style: real roofs and roads instead of the
// schematic vector style. Buildings are flat photos here, not 3D blocks.
window.setSatellite = function(on) {
  try {
    satelliteOn = !!on;
    if (satelliteOn) {
      // Verified 2026-11-03 by live tile tests for Zliten: Esri imagery
      // is real up to zoom 17 (26-32 KB tiles), but at zoom 18-19 it is
      // only the grey "Map data not yet available" placeholder (2.5 KB,
      // almost all pixels #CCCCCC). The old cap of 19 was therefore
      // wrong for Libya — cap at 17, and go flat (tilted raster looks
      // distorted and hides streets).
      darkOn = false; topoOn = false;
      if (map.getZoom() > 17) { map.setZoom(17); }
      try { map.setMaxZoom(17); } catch (e2) {}
      map.easeTo({ pitch: 0, duration: 300 });
      map.setStyle({ version: 8, sources: { sat: { type: 'raster', tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'], tileSize: 256, maxzoom: 17, attribution: '© Esri' } }, layers: [{ id: 'sat', type: 'raster', source: 'sat' }] });
    } else {
      restoreVectorStyle();
    }
  } catch (e) { console.log('satellite: ' + e); }
};

map.on('load', function() {
  addBuildings();
  addRouteLayer();
});

// A style change (including the CARTO fallback) removes custom layers,
// so buildings and the route must be re-added after every style load,
// not only on the first map load. Alternatives too, from the last call.
// If a route was requested while the style was still loading, its
// camera fit was deferred here too — otherwise the map would stay on
// the initial country view even after the line finally appeared.
var routeFitPending = false;
map.on('style.load', function() {
  addBuildings();
  addRouteLayer();
  try { if (lastAltGeometries) { window.setRoutes(lastAltGeometries, lastAltSelected); } } catch (e) {}
  try {
    if (routeFitPending && routeCoords.length > 0) {
      var bounds = routeCoords.reduce(function(b, c) { return b.extend(c); }, new maplibregl.LngLatBounds(routeCoords[0], routeCoords[0]));
      map.fitBounds(bounds, { padding: 60, pitch: 0 });
      routeFitPending = false;
    }
  } catch (e2) {}
});

// If tiles still have not loaded after 6 seconds (was 12), switch to
// the fallback style once. Waiting 12 seconds left the user staring at
// a white map; 6 seconds is enough to tell the primary style is stuck.
// If the fallback also has no tiles after another 10 seconds, say so
// plainly in the map note instead of staying silently white.
var fallbackTried = false;
setTimeout(function() {
  try {
    if (!fallbackTried && !satelliteOn && !darkOn && !topoOn && !map.areTilesLoaded() && styleIndex === 0) {
      fallbackTried = true;
      styleIndex = 1;
      map.setStyle(styleUrls[1]);
      document.getElementById('note').textContent = 'تم التبديل إلى نمط خريطة بديل — جارٍ تحميل البلاطات…';
      setTimeout(function() {
        try {
          if (!satelliteOn && !darkOn && !topoOn && !map.areTilesLoaded()) {
            document.getElementById('note').textContent = 'تعذر تحميل بلاطات الخريطة — تحقق من الاتصال، أو اضغط «إعادة تحميل الخريطة» من التفاصيل.';
            // AUDIT FIX (v4.1.1): the note sits at the top of the map,
            // behind the native search card, so the user never saw this
            // warning — a tile-less map looked silently dead. Tell the
            // native side too, so it can show a Toast over everything.
            try { DaliliBridge.onTilesFailed(); } catch (tf) {}
          }
        } catch (e2) {}
      }, 10000);
    }
  } catch (e) { console.log('fallback: ' + e); }
}, 6000);

map.on('error', function(e) {
  try {
    if (e && e.error && e.error.status === 0) {
      document.getElementById('note').textContent = 'تعذر تحميل بلاطات الخريطة — تحقق من الاتصال بالإنترنت.';
      try { DaliliBridge.onTilesFailed(); } catch (tf) {}
    }
  } catch (err) {}
});

// Destination pin: a red marker at the exact destination point, so
// the user can see precisely where the route ends — previously the
// only marker was the orange origin/user marker, and the destination
// was just a city centre with nothing marking it on the map.
var destMarker = null;
window.setDestination = function(lon, lat, name) {
  try {
    if (lon == null || lat == null) return;
    if (!destMarker) {
      destMarker = new maplibregl.Marker({ color: '#D32F2F' }).addTo(map);
    }
    destMarker.setLngLat([lon, lat]);
    // setText (not setHTML) so a place name can never inject markup.
    destMarker.setPopup(new maplibregl.Popup({ offset: 25 }).setText(name || 'الوجهة'));
  } catch (e) {}
};
window.openDestinationPopup = function() {
  try { if (destMarker && destMarker.getPopup() && !destMarker.getPopup().isOpen()) { destMarker.togglePopup(); } } catch (e) {}
};

// Tapped-point marker, for ordinary map taps (see the click handler).
var tapMarker = null;
window.clearTapMarker = function() {
  try { if (tapMarker) { tapMarker.remove(); tapMarker = null; } } catch (e) {}
};

// AUDIT FIX (v3.9) — why tapping a place did nothing: the old click
// handler returned immediately unless pick mode was on, so an ordinary
// tap on a place gave zero feedback — no move, no pin, no info —
// unlike a global map app, where tapping a place centres it and shows
// details. And even in pick mode the only feedback waited for the
// network route fetch, so a slow or failed fetch looked like a dead
// map. Now EVERY tap responds instantly on the map itself: the map
// moves to the tapped point and drops a pin, before any network call.
// Pick mode routes to it; an ordinary tap shows the tapped-place card.
var pickDestination = false;
window.setPickDestination = function(on) { pickDestination = !!on; };
map.on('click', function(e) {
  var lng = e.lngLat.lng, lat = e.lngLat.lat;
  // AUDIT FIX (v4.1.1) — why tapping a place looked dead on the user's
  // phone although the tap card opened: the old move was a 400 ms
  // easeTo animation whose errors were swallowed, so on a slow or
  // tile-less map the camera could stay put (and with no tiles drawn,
  // even a moved camera looks identical). A tap must move NOW and
  // provably: jumpTo is synchronous and cannot be lost to an animation
  // conflict, and the pin is made click-through so re-tapping the same
  // pin still reaches this handler instead of being eaten by the marker.
  try { map.jumpTo({ center: [lng, lat], zoom: Math.max(map.getZoom(), 15) }); } catch (err) {}
  if (pickDestination) {
    pickDestination = false;
    window.setDestination(lng, lat, 'الوجهة المختارة');
    window.openDestinationPopup();
    try { DaliliBridge.onDestinationPicked(lng, lat); } catch (err) {}
  } else {
    try {
      if (!tapMarker) {
        tapMarker = new maplibregl.Marker({ color: '#1976D2' }).addTo(map);
        try { tapMarker.getElement().style.pointerEvents = 'none'; } catch (pe) {}
      }
      tapMarker.setLngLat([lng, lat]);
    } catch (err) {}
    try { DaliliBridge.onMapTapped(lng, lat); } catch (err) {}
  }
});

window.setRoute = function(geometry) {
  currentGeometry = geometry;
  routeCoords = geometry.coordinates || [];
  // AUDIT FIX (v3.11) — why the map stayed frozen on the initial
  // country view with only time pills visible: the old code called
  // addRouteLayer() first with no error handling, so if the style was
  // still loading, adding the layer threw and aborted setRoute BEFORE
  // fitBounds ever ran. The pills still appeared because they are DOM
  // markers drawn by a separate call that needs no style. Now each
  // step is independent: layers are best-effort, but the camera move
  // always runs — a route must move the map even if its line has to
  // wait for the style, in which case style.load fits it (above).
  try { addRouteLayer(); } catch (e) {}
  // A route must be viewed flat: if the user previously enabled 3D,
  // the tilted view leaves huge buildings standing over the road and
  // the route itself is hard to follow. Pass pitch: 0 to fitBounds
  // itself — a separate easeTo is cancelled by fitBounds, so it alone
  // did not reliably flatten the view. 3D remains on demand via the
  // 3D button.
  if (routeCoords.length > 0) {
    routeFitPending = true;
    try {
      var bounds = routeCoords.reduce(function(b, c) { return b.extend(c); }, new maplibregl.LngLatBounds(routeCoords[0], routeCoords[0]));
      map.fitBounds(bounds, { padding: 60, pitch: 0 });
      // Only clear the deferred fit once the style is actually
      // loaded: a camera move issued before load may be dropped, and
      // then style.load above must still fit the route.
      if (map.isStyleLoaded()) { routeFitPending = false; }
    } catch (e2) {}
  }
  try {
    if (!marker && routeCoords.length > 0) {
      marker = new maplibregl.Marker({ color: '#E67E22' }).setLngLat(routeCoords[0]).addTo(map);
    }
  } catch (e3) {}
};

window.previewRoute = function(progress) {
  if (!routeCoords.length) return;
  var idx = Math.floor(progress * (routeCoords.length - 1));
  var pos = routeCoords[idx];
  if (!marker) { marker = new maplibregl.Marker({ color: '#E67E22' }).setLngLat(pos).addTo(map); }
  else { marker.setLngLat(pos); }
  // The preview follows the route, so it must also be flat — a tilted
  // view leaves buildings standing over the moving marker.
  try { if (map.getPitch() !== 0) { map.setPitch(0); } } catch (e) {}
  // At country zoom the moving marker is almost invisible, so zoom in
  // for the preview instead of staying at zoom 5.5 or 8.
  if (map.getZoom() < 11) { map.setZoom(11); }
  map.setCenter(pos);
};

// Automatic animated preview (the "4D" preview): moves the marker along
// the whole route over 30 seconds, instead of only dragging the slider.
var previewAnimId = null;
var previewAnimStart = 0;
window.startPreviewAnimation = function() {
  if (!routeCoords.length) return false;
  window.stopPreviewAnimation();
  previewAnimStart = Date.now();
  function step() {
    var p = Math.min(1, (Date.now() - previewAnimStart) / 30000);
    window.previewRoute(p);
    if (p < 1) { previewAnimId = requestAnimationFrame(step); }
    else {
      previewAnimId = null;
      try { if (window.DaliliBridge) { window.DaliliBridge.onPreviewFinished(); } } catch (e) {}
    }
  }
  step();
  return true;
};
window.stopPreviewAnimation = function() {
  if (previewAnimId) { cancelAnimationFrame(previewAnimId); previewAnimId = null; }
};

window.setPitch = function(pitch) { map.setPitch(pitch); };

// Real 3D: pitch alone does nothing visible at country zoom, because the
// buildings layer only renders at zoom 15+. So enabling 3D also flies to
// a building area (the current marker, or Tripoli) at zoom 16 with pitch 60,
// and re-adds the buildings layer. If the fallback CARTO style is active,
// it first switches back to OpenFreeMap, whose source is openmaptiles.
function apply3d() {
  addBuildings();
  var target = marker ? marker.getLngLat() : [13.1913, 32.8872];
  map.flyTo({ center: target, zoom: 16, pitch: 60, duration: 1500 });
}
window.set3d = function(enabled) {
  if (!enabled) { map.setPitch(0); return; }
  // Backup guard (Kotlin also turns non-vector modes off first): 3D on
  // a flat raster shows no buildings at all, so restore the vector
  // style before flying to a building area.
  if (satelliteOn || darkOn || topoOn) {
    restoreVectorStyle();
    map.once('style.load', function() { apply3d(); });
    return;
  }
  if (styleIndex !== 0) {
    styleIndex = 0;
    map.setStyle(styleUrls[0]);
    map.once('style.load', function() { apply3d(); });
    return;
  }
  apply3d();
};

// Driving view, like Google Maps navigation: the map follows the user
// at street zoom (17, where street names and places render), rotates to
// the GPS heading and stays flat, so the street being driven on is
// always visible in the centre. Called only while following is on.
window.followUser = function(lon, lat, bearing) {
  if (!marker) { marker = new maplibregl.Marker({ color: '#E67E22' }).setLngLat([lon, lat]).addTo(map); }
  else { marker.setLngLat([lon, lat]); }
  try {
    map.easeTo({ center: [lon, lat], zoom: Math.max(map.getZoom(), 17), bearing: bearing || 0, pitch: 0, duration: 600 });
  } catch (e) { map.setCenter([lon, lat]); }
};

// When the user drags the map during navigation, following pauses and
// Kotlin shows the "recenter" button, exactly like Google Maps.
map.on('dragstart', function() {
  try { if (window.DaliliBridge) { window.DaliliBridge.onMapDragged(); } } catch (e) {}
});

window.setMarker = function(lon, lat) {
  if (!marker) { marker = new maplibregl.Marker({ color: '#E67E22' }).setLngLat([lon, lat]).addTo(map); }
  else { marker.setLngLat([lon, lat]); }
  map.setCenter([lon, lat]);
  map.setZoom(12);
  try { map.setPitch(0); } catch (e) {}
};

window.clearReports = function() {
  for (var i = 0; i < reportMarkers.length; i++) { reportMarkers[i].remove(); }
  reportMarkers = [];
};

window.addReport = function(lon, lat, type) {
  var m = new maplibregl.Marker({ color: '#C0392B' }).setLngLat([lon, lat]).setPopup(new maplibregl.Popup().setText(type + ' — بلاغ مستخدم، غير مؤكد رسميًا.')).addTo(map);
  reportMarkers.push(m);
};
</script>
</body>
</html>
