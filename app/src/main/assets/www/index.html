<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>دليلي ليبيا</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  html, body { margin: 0; height: 100%; }
  #map { width: 100%; height: 100%; background: #e8e8e8; }
  #note { position: absolute; top: 8px; right: 8px; background: rgba(255,255,255,0.9); padding: 6px 10px; font-family: sans-serif; font-size: 12px; z-index: 10; }
</style>
</head>
<body>
<div id="map"></div>
<div id="note">خريطة ليبيا — اسحب للتكبير والتدوير</div>
<script>
var styleUrls = [
  'https://tiles.openfreemap.org/styles/liberty',
  'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json'
];
var styleIndex = 0;
var map = new maplibregl.Map({
  container: 'map',
  style: styleUrls[0],
  center: [17.0, 27.0],
  zoom: 5.5,
  pitch: 0
});
map.addControl(new maplibregl.NavigationControl(), 'top-left');
var routeCoords = [];
var currentGeometry = null;
var marker = null;
var reportMarkers = [];

function addBuildings() {
  try {
    var layers = map.getStyle().layers;
    var labelLayer = null;
    for (var i = 0; i < layers.length; i++) {
      if (layers[i].type === 'symbol' && layers[i].layout && layers[i].layout['text-field']) { labelLayer = layers[i].id; break; }
    }
    if (!map.getSource('openmaptiles')) return;
    if (map.getLayer('3d-buildings')) return;
    map.addLayer({
      'id': '3d-buildings',
      'source': 'openmaptiles',
      'source-layer': 'building',
      'filter': ['==', 'extrude', 'true'],
      'type': 'fill-extrusion',
      'minzoom': 15,
      'paint': {
        'fill-extrusion-color': '#aaaaaa',
        'fill-extrusion-height': ['interpolate', ['linear'], ['zoom'], 15, 0, 15.05, ['get', 'render_height']],
        'fill-extrusion-base': ['interpolate', ['linear'], ['zoom'], 15, 0, 15.05, ['get', 'render_min_height']],
        'fill-extrusion-opacity': 0.6
      }
    }, labelLayer);
  } catch (e) { console.log('3d buildings: ' + e); }
}

function addRouteLayer() {
  if (!currentGeometry) return;
  var geojson = { type: 'Feature', geometry: currentGeometry };
  if (map.getSource('route')) {
    map.getSource('route').setData(geojson);
  } else {
    map.addSource('route', { type: 'geojson', data: geojson });
    map.addLayer({ id: 'route-line', type: 'line', source: 'route', paint: { 'line-color': '#0B6B4F', 'line-width': 5 } });
  }
}

map.on('load', function() {
  addBuildings();
  addRouteLayer();
});

// A style change (including the CARTO fallback) removes custom layers,
// so buildings and the route must be re-added after every style load,
// not only on the first map load.
map.on('style.load', function() {
  addBuildings();
  addRouteLayer();
});

// If tiles still have not loaded after 12 seconds, switch to the fallback style once.
// This is what fixes the blank white map when the primary tile style is unreachable.
var fallbackTried = false;
setTimeout(function() {
  try {
    if (!fallbackTried && !map.areTilesLoaded() && styleIndex === 0) {
      fallbackTried = true;
      styleIndex = 1;
      map.setStyle(styleUrls[1]);
      document.getElementById('note').textContent = 'تم التبديل إلى نمط خريطة بديل — جارٍ تحميل البلاطات…';
    }
  } catch (e) { console.log('fallback: ' + e); }
}, 12000);

map.on('error', function(e) {
  try {
    if (e && e.error && e.error.status === 0) {
      document.getElementById('note').textContent = 'تعذر تحميل بلاطات الخريطة — تحقق من الاتصال بالإنترنت.';
    }
  } catch (err) {}
});

window.setRoute = function(geometry) {
  currentGeometry = geometry;
  routeCoords = geometry.coordinates || [];
  addRouteLayer();
  if (routeCoords.length > 0) {
    var bounds = routeCoords.reduce(function(b, c) { return b.extend(c); }, new maplibregl.LngLatBounds(routeCoords[0], routeCoords[0]));
    map.fitBounds(bounds, { padding: 40 });
  }
  if (!marker && routeCoords.length > 0) {
    marker = new maplibregl.Marker({ color: '#E67E22' }).setLngLat(routeCoords[0]).addTo(map);
  }
};

window.previewRoute = function(progress) {
  if (!routeCoords.length) return;
  var idx = Math.floor(progress * (routeCoords.length - 1));
  var pos = routeCoords[idx];
  if (!marker) { marker = new maplibregl.Marker({ color: '#E67E22' }).setLngLat(pos).addTo(map); }
  else { marker.setLngLat(pos); }
  // At country zoom the moving marker is almost invisible, so zoom in
  // for the preview instead of staying at zoom 5.5 or 8.
  if (map.getZoom() < 11) { map.setZoom(11); }
  map.setCenter(pos);
};

// Automatic animated preview (the "4D" preview): moves the marker along
// the whole route over 30 seconds, instead of only dragging the slider.
var previewAnimId = null;
var previewAnimStart = 0;
window.startPreviewAnimation = function() {
  if (!routeCoords.length) return false;
  window.stopPreviewAnimation();
  previewAnimStart = Date.now();
  function step() {
    var p = Math.min(1, (Date.now() - previewAnimStart) / 30000);
    window.previewRoute(p);
    if (p < 1) { previewAnimId = requestAnimationFrame(step); }
    else { previewAnimId = null; }
  }
  step();
  return true;
};
window.stopPreviewAnimation = function() {
  if (previewAnimId) { cancelAnimationFrame(previewAnimId); previewAnimId = null; }
};

window.setPitch = function(pitch) { map.setPitch(pitch); };

// Real 3D: pitch alone does nothing visible at country zoom, because the
// buildings layer only renders at zoom 15+. So enabling 3D also flies to
// a building area (the current marker, or Tripoli) at zoom 16 with pitch 60,
// and re-adds the buildings layer. If the fallback CARTO style is active,
// it first switches back to OpenFreeMap, whose source is openmaptiles.
function apply3d() {
  addBuildings();
  var target = marker ? marker.getLngLat() : [13.1913, 32.8872];
  map.flyTo({ center: target, zoom: 16, pitch: 60, duration: 1500 });
}
window.set3d = function(enabled) {
  if (!enabled) { map.setPitch(0); return; }
  if (styleIndex !== 0) {
    styleIndex = 0;
    map.setStyle(styleUrls[0]);
    map.once('style.load', function() { apply3d(); });
    return;
  }
  apply3d();
};

window.setMarker = function(lon, lat) {
  if (!marker) { marker = new maplibregl.Marker({ color: '#E67E22' }).setLngLat([lon, lat]).addTo(map); }
  else { marker.setLngLat([lon, lat]); }
  map.setCenter([lon, lat]);
  map.setZoom(12);
};

window.clearReports = function() {
  for (var i = 0; i < reportMarkers.length; i++) { reportMarkers[i].remove(); }
  reportMarkers = [];
};

window.addReport = function(lon, lat, type) {
  var m = new maplibregl.Marker({ color: '#C0392B' }).setLngLat([lon, lat]).setPopup(new maplibregl.Popup().setText(type + ' — بلاغ مستخدم، غير مؤكد رسميًا.')).addTo(map);
  reportMarkers.push(m);
};
</script>
</body>
</html>
